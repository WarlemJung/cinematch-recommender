name: CineMatch CI

on:
  push:
    branches: [main, master, "fix/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Python ${{ matrix.python-version }} — Lint, Typecheck, Test & Security Audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python syntax compilation
        run: |
          python -m py_compile app.py recommender.py
          python -m compileall -q src tests scripts

      - name: Run Ruff linter
        run: |
          ruff check src tests scripts app.py recommender.py

      - name: Run Mypy static type checker
        run: |
          mypy src tests scripts app.py recommender.py

      - name: Run Unit tests
        run: |
          pytest tests/unit -v

      - name: Run Integration tests
        run: |
          pytest tests/integration -v

      - name: Enforce Test Coverage (>= 80%, including Application Factory)
        run: |
          pytest --cov=src/cinematch --cov-report=term-missing --cov-fail-under=80

      - name: Run Dependency Security Audit
        run: |
          pip check
          pip-audit --skip-editable
