name: CineMatch CI

on:
  push:
    branches: [main, master, "fix/**", "feat/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Python ${{ matrix.python-version }} — Lint, Typecheck, Test & Security Audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies from pyproject.toml
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -e ".[dev]"

      - name: Verify Python syntax compilation
        run: |
          python -m py_compile app.py recommender.py
          python -m compileall -q src tests scripts

      - name: Run Ruff linter
        run: |
          ruff check src tests scripts app.py recommender.py

      - name: Run Mypy static type checker
        run: |
          mypy src tests scripts app.py recommender.py

      - name: Run Unit tests
        run: |
          pytest tests/unit -v

      - name: Run Integration tests
        run: |
          pytest tests/integration -v

      - name: Enforce Test Coverage (>= 80%, including Application Factory)
        run: |
          pytest --cov=src/cinematch --cov-report=term-missing --cov-fail-under=80

      - name: Run Dependency Security Audit
        run: |
          pip check
          pip-audit --skip-editable

  docker-build-smoke:
    name: Docker Production Image Build & Non-Root Smoke Check
    needs: quality-and-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: |
          docker build -t cinematch-recommender:ci .

      - name: Verify non-root user and WSGI Gunicorn import in container
        run: |
          docker run --rm cinematch-recommender:ci sh -c "id -u | grep -qx 10001 && python -c 'import cinematch.wsgi; import gunicorn; print(cinematch.wsgi.__name__)'"
