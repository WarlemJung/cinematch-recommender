<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineAI | Next-Gen Recommender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="background-glow"></div>

    <header>
        <div class="logo">
            <i class="fa-solid fa-film"></i> Cine<span>AI</span>
        </div>
        <div class="search-container">
            <input type="text" id="movieSearch" placeholder="Search for a movie you love...">
            <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
    </header>

    <main>
        <section id="hero-section">
            <h1>Discover Your Next <span class="gradient-text">Obsession</span></h1>
            <p>Powered by Advanced Machine Learning</p>
        </section>

        <section id="results-section" class="hidden">
            <div class="section-header">
                <h2><i class="fa-solid fa-wand-magic-sparkles"></i> Because you liked <span id="searched-title"
                        class="highlight">...</span></h2>
                <button class="close-results"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="movie-grid" id="recommendations-grid">
                <!-- Recommendations will be injected here -->
            </div>
        </section>

        <section id="trending-section">
            <div class="section-header">
                <h2><i class="fa-solid fa-fire"></i> Trending Now</h2>
            </div>
            <div class="movie-grid" id="trending-grid">
                <!-- Trending movies will be injected here -->
            </div>
        </section>
    </main>

    <footer>
        <p>Designed by Warlem Jung</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
